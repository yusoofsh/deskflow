# Builds the Windows installer for the audio-sharing work. The upstream CI only
# runs on master, tags and pull requests, so it does not produce installers here.
name: Personal build

on:
  push:
    branches: [audio-build]
  workflow_dispatch:

jobs:
  windows:
    name: windows-2022-x64
    runs-on: windows-2022
    timeout-minutes: 45
    permissions:
      contents: read

    steps:
      # gets the tags, so the version comes out right
      - name: Fancy Checkout
        uses: sithlord48/fancy-checkout@v2

      - name: Setup VC++ environment
        uses: TheMrMilchmann/setup-msvc-dev@v4
        with:
          arch: amd64
          spectre: true

      - name: Install dependencies
        id: get-deps
        uses: ./.github/actions/install-dependencies
        with:
          qt-version: 6.12
          vcpkg-triplet: x64-windows-release

      - name: Get version
        uses: ./.github/actions/get-version

      - name: Configure
        run: cmake -Bbuild -G Ninja -DCMAKE_BUILD_TYPE=Release -DCMAKE_COMPILE_WARNING_AS_ERROR=ON ${{ steps.get-deps.outputs.vcpkg-cmake-config }} -DPACKAGE_VERSION_LABEL="${{ env.DESKFLOW_PACKAGE_VERSION }}-audio"

      - name: Build
        shell: bash
        run: cmake --build build --config Release -j8 --target package

      - name: Clipboard, file transfer, touchpad, brightness and audio tests
        shell: bash
        env:
          QT_QPA_PLATFORM: offscreen
        run: ctest --test-dir build/src/unittests -R "Clipboard|FileTransfer|TouchpadGesture|BrightnessKey|Audio" --output-on-failure

      - name: Upload
        uses: actions/upload-artifact@v7
        with:
          name: deskflow-audio-windows-x64
          path: ${{ github.workspace }}/build/deskflow[-_]*.*
